<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F4F3F0;
      --navy: #152A54;
      --red: #C8102E;
      --ink: #1C2230;
      --card: #FFFFFF;
      --green: #1E7145;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); }
    .center-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 380px; padding: 28px; border-radius: 16px; background: var(--card); border: 2px solid var(--navy); }
    .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .brand-row h1 { font-family: 'Oswald', sans-serif; color: var(--navy); font-size: 22px; font-weight: 700; text-transform: uppercase; margin: 0; }
    .sub-label { font-size: 11px; font-weight: 600; color: var(--red); letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 16px; }
    .helper { font-size: 13px; opacity: 0.7; margin: 0 0 18px; line-height: 1.4; }
    label.field-label { font-size: 12px; font-weight: 600; opacity: 0.8; display: block; margin-bottom: 4px; }
    input.plain { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #1c223022; font-size: 14px; font-family: 'Inter', sans-serif; margin-bottom: 14px; }
    .primary-btn { width: 100%; padding: 11px; border-radius: 8px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; }
    .primary-btn.navy { background: var(--navy); color: #fff; }
    .primary-btn.white { background: #fff; color: var(--navy); }
    .primary-btn.green { background: var(--green); color: #fff; }
    .primary-btn:disabled { opacity: 0.4; }
    .error-text { font-size: 12px; color: var(--red); margin: 0 0 10px; }

    .instr-wrap { min-height: 100vh; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .instr-inner { width: 100%; max-width: 380px; }
    .instr-eyebrow { font-size: 12px; font-weight: 600; color: var(--red); letter-spacing: 1.5px; text-transform: uppercase; text-align: center; margin: 0 0 6px; }
    .instr-code-label { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; color: #fff; opacity: 0.85; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px; }
    .instr-code { font-family: 'Oswald', sans-serif; font-size: 52px; font-weight: 700; color: #fff; letter-spacing: 2px; line-height: 1; text-align: center; margin: 0 0 24px; }
    .instr-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 8px; background: #ffffff12; margin-bottom: 12px; }
    .instr-num { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--red); min-width: 22px; }
    .instr-text { font-size: 13px; color: #fff; opacity: 0.9; line-height: 1.4; margin: 0; }

    .app-header { padding: 16px; background: var(--navy); border-bottom: 3px solid var(--red); }
    .app-header .brand-row h1 { color: #fff; font-size: 18px; }
    .app-header .sub-label { margin: 0; }
    .header-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .header-meta p { font-size: 12px; color: #fff; opacity: 0.85; margin: 0; }
    .header-meta .code-inline { color: var(--red); font-weight: 700; }
    .edit-link { font-size: 11px; color: var(--red); font-weight: 600; background: none; border: none; cursor: pointer; }

    .content { padding: 16px; }
    .form-card { padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid #1c223015; margin-bottom: 16px; }
    .price-qty-row { display: flex; gap: 12px; margin-bottom: 4px; }
    .price-qty-row > div:first-child { flex: 1; }
    .price-input-row { display: flex; align-items: center; gap: 8px; }
    .price-input-row span { font-size: 18px; font-weight: 700; color: var(--navy); }
    .price-input-row input { flex: 1; font-size: 17px; font-weight: 700; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #1c223022; font-family: 'Inter', sans-serif; }
    .qty-box { width: 90px; }
    .qty-box input { width: 100%; text-align: center; font-size: 17px; font-weight: 700; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #1c223022; font-family: 'Inter', sans-serif; }
    .qty-hint { font-size: 11px; opacity: 0.55; margin: 4px 0 12px; }

    .sticker-block { padding: 16px; border-radius: 12px; background: var(--navy); border: 2px solid var(--red); margin-bottom: 16px; }
    .sticker-eyebrow { font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 8px; }
    .sticker-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: #fff; margin-bottom: 8px; }
    .sticker-code { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: 0.5px; }
    .sticker-price { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--red); }
    .dismiss-link { font-size: 11px; color: #fff; opacity: 0.7; background: none; border: none; cursor: pointer; margin-top: 6px; }

    .items-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .items-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin: 0; }
    .items-total { font-size: 13px; font-weight: 700; color: var(--red); margin: 0; }
    .empty-note { font-size: 13px; opacity: 0.5; text-align: center; padding: 24px 0; }
    .sync-note { font-size: 11px; opacity: 0.5; margin: 0 0 8px; }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 8px; background: var(--card); border: 1px solid #1c223015; margin-bottom: 8px; }
    .item-row-left { display: flex; align-items: center; gap: 8px; }
    .item-row-left p { margin: 0; font-size: 14px; color: var(--ink); }
    .item-row-code { font-size: 11px; font-weight: 700; color: var(--navy); margin: 0; }
    .item-row-right { display: flex; align-items: center; gap: 12px; }
    .item-row-right p { font-weight: 700; color: var(--navy); margin: 0; }
    .remove-btn { background: none; border: none; cursor: pointer; opacity: 0.7; }
    .footer-note { font-size: 11px; opacity: 0.45; text-align: center; margin-top: 20px; }
    .done-btn { margin-top: 16px; }

    .summary-wrap { min-height: 100vh; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .summary-inner { width: 100%; max-width: 380px; text-align: center; }
    .summary-total { font-family: 'Oswald', sans-serif; font-size: 44px; font-weight: 700; color: #fff; line-height: 1; margin: 4px 0; }
    .summary-sub { font-size: 13px; color: #fff; opacity: 0.8; margin: 0 0 24px; }
    .summary-list { text-align: left; border-radius: 8px; overflow: hidden; margin-bottom: 24px; background: #ffffff12; max-height: 240px; overflow-y: auto; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #ffffff1a; }
    .summary-row p { margin: 0; font-size: 12px; color: #fff; }
    .summary-note { font-size: 12px; color: #fff; opacity: 0.6; margin: 0 0 16px; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL BELOW (ends in /exec) — this is the
    // only line you need to edit before uploading this file to GitHub.
    var API_URL = 'https://script.google.com/macros/s/AKfycbzqQZ_EP7TsmaZs0E7FFUNeij8KBmJAnZOw4mOlwPAIXfP80sjj31k6U6fe8jvrDirAqA/exec';

    function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

    function loadProfile() {
      try { return JSON.parse(localStorage.getItem('sellerProfile') || 'null'); } catch (e) { return null; }
    }
    function saveProfileLocal(p) {
      try { localStorage.setItem('sellerProfile', JSON.stringify(p)); } catch (e) {}
    }

    var savedProfile = loadProfile();

    var state = {
      step: savedProfile && savedProfile.firstName ? 'items' : 'profile',
      firstName: (savedProfile && savedProfile.firstName) || '',
      lastName: (savedProfile && savedProfile.lastName) || '',
      phone: (savedProfile && savedProfile.phone) || '',
      sellerCode: (savedProfile && savedProfile.code) || '',
      registering: false,
      registerError: null,
      itemName: '',
      itemPrice: '',
      quantity: '1',
      submitting: false,
      myItems: [],
      lastBatch: null,
      error: null,
      syncingItems: false
    };

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function postAction(payload) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) { return res.json(); });
    }

    function fetchMyItems() {
      if (!state.firstName.trim() || !state.lastName.trim()) return;
      setState({ syncingItems: true });
      fetch(API_URL).then(function (r) { return r.json(); }).then(function (data) {
        var fullName = (state.firstName.trim() + ' ' + state.lastName.trim()).toLowerCase();
        var mine = (data.items || [])
          .filter(function (i) { return String(i.Seller || '').trim().toLowerCase() === fullName; })
          .map(function (i) { return { id: i.ID, item: i.Item, price: Number(i.Price) || 0, code: i.Code }; })
          .sort(function (a, b) { return String(a.code).localeCompare(String(b.code), undefined, { numeric: true }); });
        setState({ myItems: mine, syncingItems: false });
      }).catch(function () {
        setState({ syncingItems: false });
      });
    }

    function registerSeller() {
      if (!state.firstName.trim() || !state.lastName.trim() || !state.phone.trim()) return;
      setState({ registering: true, registerError: null });
      postAction({
        action: 'register_seller',
        sellerName: state.firstName.trim() + ' ' + state.lastName.trim(),
        firstName: state.firstName.trim(),
        lastName: state.lastName.trim(),
        phone: state.phone.trim()
      }).then(function (result) {
        if (result.success && result.sellerCode) {
          var profile = { firstName: state.firstName.trim(), lastName: state.lastName.trim(), phone: state.phone.trim(), code: result.sellerCode };
          saveProfileLocal(profile);
          setState({ registering: false, sellerCode: result.sellerCode, step: 'instructions' });
        } else {
          setState({ registering: false, registerError: 'Could not connect - check your connection and try again.' });
        }
      }).catch(function () {
        setState({ registering: false, registerError: 'Could not connect - check your connection and try again.' });
      });
    }

    function addItem() {
      var price = parseFloat(state.itemPrice);
      var qty = Math.max(1, parseInt(state.quantity, 10) || 1);
      if (!state.itemName.trim() || isNaN(price) || price <= 0) return;
      setState({ submitting: true, error: null });
      postAction({
        action: 'add_item',
        sellerName: state.firstName.trim() + ' ' + state.lastName.trim(),
        firstName: state.firstName.trim(),
        lastName: state.lastName.trim(),
        phone: state.phone.trim(),
        item: state.itemName.trim(),
        price: price,
        quantity: qty
      }).then(function (result) {
        if (result.success) {
          if (result.sellerCode && result.sellerCode !== state.sellerCode) {
            state.sellerCode = result.sellerCode;
            saveProfileLocal({ firstName: state.firstName.trim(), lastName: state.lastName.trim(), phone: state.phone.trim(), code: result.sellerCode });
          }
          state.myItems = state.myItems.concat(result.items);
          setState({ submitting: false, lastBatch: result.items, itemName: '', itemPrice: '', quantity: '1' });
        } else {
          setState({ submitting: false, error: 'That did not save - check your connection and try again.' });
        }
      }).catch(function () {
        setState({ submitting: false, error: 'That did not save - check your connection and try again.' });
      });
    }

    function removeItem(item) {
      state.myItems = state.myItems.filter(function (i) { return i.id !== item.id; });
      render();
      postAction({ action: 'remove_item', id: item.id, sellerName: state.firstName.trim() + ' ' + state.lastName.trim() }).catch(function () {});
    }

    function getTotal() {
      return state.myItems.reduce(function (s, i) { return s + Number(i.price || 0); }, 0);
    }

    // -------------------- render --------------------
    function render() {
      var app = document.getElementById('app');
      var html;
      if (state.step === 'profile') html = renderProfile();
      else if (state.step === 'instructions') html = renderInstructions();
      else if (state.step === 'summary') html = renderSummary();
      else html = renderItems();

      app.innerHTML = html;
      attachHandlers();

      if (state.step === 'items' && state._justEnteredItems) {
        state._justEnteredItems = false;
        fetchMyItems();
      }
    }

    function renderProfile() {
      return '' +
        '<div class="center-wrap"><div class="card">' +
          '<div class="brand-row"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg><h1>Add Your Items</h1></div>' +
          '<p class="sub-label">Bronco Uniform Exchange</p>' +
          '<p class="helper">We will text you when your items sell, and again at the end of the sale.</p>' +
          '<label class="field-label">First name</label>' +
          '<input class="plain" id="firstNameInput" placeholder="Jane" value="' + state.firstName + '">' +
          '<label class="field-label">Last name</label>' +
          '<input class="plain" id="lastNameInput" placeholder="Doe" value="' + state.lastName + '">' +
          '<label class="field-label">Cell phone</label>' +
          '<input class="plain" id="phoneInput" placeholder="5551234567" value="' + state.phone + '">' +
          (state.registerError ? '<p class="error-text">' + state.registerError + '</p>' : '') +
          '<button class="primary-btn navy" id="continueBtn"' + (state.registering ? ' disabled' : '') + '>' + (state.registering ? 'Connecting...' : 'Continue') + '</button>' +
        '</div></div>';
    }

    function renderInstructions() {
      var code = state.sellerCode;
      return '' +
        '<div class="instr-wrap"><div class="instr-inner">' +
          '<p class="instr-eyebrow">Hi ' + state.firstName + ', here is how it works</p>' +
          '<p class="instr-code-label">Your seller code</p>' +
          '<p class="instr-code">' + code + '</p>' +
          '<div class="instr-step"><span class="instr-num">1</span><p class="instr-text">Add each item below with its price. We will give it its own number after your code - like <strong>' + code + '-01</strong>, <strong>' + code + '-02</strong>.</p></div>' +
          '<div class="instr-step"><span class="instr-num">2</span><p class="instr-text">For each item, write its number and price on a sticker - for example <strong>' + code + '-01 &nbsp; $8</strong>.</p></div>' +
          '<div class="instr-step"><span class="instr-num">3</span><p class="instr-text">Stick it on that exact item so it is ready to sell - no relabeling needed at the sale.</p></div>' +
          '<button class="primary-btn white" id="startAddingBtn" style="margin-top:8px;">Got it, let&rsquo;s add my items</button>' +
        '</div></div>';
    }

    function renderSummary() {
      var total = getTotal();
      var rows = state.myItems.map(function (item) {
        return '<div class="summary-row"><p>' + item.code + ' &middot; ' + item.item + '</p><p style="font-weight:700;">' + money(item.price) + '</p></div>';
      }).join('');
      return '' +
        '<div class="summary-wrap"><div class="summary-inner">' +
          '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="margin:0 auto 12px;display:block;"><path d="M20 6L9 17l-5-5"/></svg>' +
          '<p class="instr-eyebrow">Nice work, ' + state.firstName + '</p>' +
          '<p class="summary-total">' + money(total) + '</p>' +
          '<p class="summary-sub">' + state.myItems.length + ' item' + (state.myItems.length === 1 ? '' : 's') + ' listed under code ' + state.sellerCode + '</p>' +
          '<div class="summary-list">' + rows + '</div>' +
          '<p class="summary-note">Make sure every item has its sticker on before the sale - you can come back and add more anytime.</p>' +
          '<button class="primary-btn white" id="backToItemsBtn">Add more items</button>' +
        '</div></div>';
    }

    function renderItems() {
      var total = getTotal();
      var qtyNum = parseInt(state.quantity, 10) || 1;

      var lastBatchHtml = '';
      if (state.lastBatch && state.lastBatch.length > 0) {
        var rows = state.lastBatch.map(function (it) {
          return '<div class="sticker-row"><span class="sticker-code">' + it.code + '</span><span class="sticker-price">' + money(it.price) + '</span></div>';
        }).join('');
        lastBatchHtml = '' +
          '<div class="sticker-block">' +
            '<p class="sticker-eyebrow">Write this on ' + (state.lastBatch.length > 1 ? 'each sticker' : 'a sticker') + ', one per item</p>' +
            rows +
            '<button class="dismiss-link" id="dismissBatchBtn">Got it, dismiss</button>' +
          '</div>';
      }

      var itemsHtml = state.myItems.map(function (item) {
        return '' +
          '<div class="item-row">' +
            '<div class="item-row-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1E7145" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>' +
            '<div><p>' + item.item + '</p>' + (item.code ? '<p class="item-row-code">' + item.code + '</p>' : '') + '</div></div>' +
            '<div class="item-row-right"><p>' + money(item.price) + '</p>' +
            '<button class="remove-btn" data-remove-id="' + item.id + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" opacity="0.7"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg></button></div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="app-header">' +
          '<div class="brand-row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg><h1 style="text-transform:uppercase;">Add Your Items</h1></div>' +
          '<p class="sub-label">Bronco Uniform Exchange</p>' +
          '<div class="header-meta"><p>' + state.firstName + ' ' + state.lastName + ' &middot; ' + state.phone + (state.sellerCode ? ' &middot; Code: <span class="code-inline">' + state.sellerCode + '</span>' : '') + '</p><button class="edit-link" id="editProfileBtn">Edit</button></div>' +
        '</div>' +
        '<div class="content">' +
          lastBatchHtml +
          '<div class="form-card">' +
            '<label class="field-label">Item description</label>' +
            '<input class="plain" id="itemNameInput" placeholder="e.g. Red polo, size M" value="' + state.itemName + '">' +
            '<div class="price-qty-row">' +
              '<div><label class="field-label">Asking price</label><div class="price-input-row"><span>$</span><input type="number" step="0.25" id="itemPriceInput" placeholder="0.00" value="' + state.itemPrice + '"></div></div>' +
              '<div class="qty-box"><label class="field-label">Qty</label><input type="number" min="1" max="50" id="quantityInput" value="' + state.quantity + '"></div>' +
            '</div>' +
            (qtyNum > 1 ? '<p class="qty-hint">Creates ' + qtyNum + ' identical items, each with its own sticker code.</p>' : '') +
            (state.error ? '<p class="error-text">' + state.error + '</p>' : '') +
            '<button class="primary-btn green" id="addItemBtn"' + (state.submitting || !state.itemName.trim() || !state.itemPrice ? ' disabled' : '') + '>' + (state.submitting ? 'Adding...' : ('Add ' + (qtyNum > 1 ? qtyNum + ' items' : 'item'))) + '</button>' +
          '</div>' +
          '<div class="items-header"><p class="items-title">Your items (' + state.myItems.length + ')</p>' + (state.myItems.length > 0 ? '<p class="items-total">' + money(total) + ' total</p>' : '') + '</div>' +
          (state.syncingItems ? '<p class="sync-note">Checking the sheet for your items...</p>' : '') +
          (state.myItems.length === 0 && !state.syncingItems ? '<p class="empty-note">No items added yet - start with the form above.</p>' : '') +
          itemsHtml +
          '<p class="footer-note">Each item is saved to the sale the moment you add it - no need to submit again.</p>' +
          (state.myItems.length > 0 ? '<button class="primary-btn navy done-btn" id="doneBtn">I&rsquo;m done for now - see my total</button>' : '') +
        '</div>';
    }

    function attachHandlers() {
      var continueBtn = document.getElementById('continueBtn');
      if (continueBtn) {
        continueBtn.onclick = registerSeller;
        bindText('firstNameInput', 'firstName');
        bindText('lastNameInput', 'lastName');
        bindText('phoneInput', 'phone');
      }

      var startAddingBtn = document.getElementById('startAddingBtn');
      if (startAddingBtn) startAddingBtn.onclick = function () { state._justEnteredItems = true; setState({ step: 'items' }); };

      var backToItemsBtn = document.getElementById('backToItemsBtn');
      if (backToItemsBtn) backToItemsBtn.onclick = function () { setState({ step: 'items' }); };

      var editProfileBtn = document.getElementById('editProfileBtn');
      if (editProfileBtn) editProfileBtn.onclick = function () { setState({ step: 'profile' }); };

      var itemNameInput = document.getElementById('itemNameInput');
      if (itemNameInput) itemNameInput.oninput = function (e) { state.itemName = e.target.value; toggleAddBtn(); };
      var itemPriceInput = document.getElementById('itemPriceInput');
      if (itemPriceInput) {
        itemPriceInput.oninput = function (e) { state.itemPrice = e.target.value; toggleAddBtn(); };
        itemPriceInput.onkeydown = function (e) { if (e.key === 'Enter') addItem(); };
      }
      var quantityInput = document.getElementById('quantityInput');
      if (quantityInput) quantityInput.oninput = function (e) { state.quantity = e.target.value; render(); };

      var addItemBtn = document.getElementById('addItemBtn');
      if (addItemBtn) addItemBtn.onclick = addItem;

      var dismissBatchBtn = document.getElementById('dismissBatchBtn');
      if (dismissBatchBtn) dismissBatchBtn.onclick = function () { setState({ lastBatch: null }); };

      document.querySelectorAll('[data-remove-id]').forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute('data-remove-id');
          var item = state.myItems.filter(function (i) { return i.id === id; })[0];
          if (item) removeItem(item);
        };
      });

      var doneBtn = document.getElementById('doneBtn');
      if (doneBtn) doneBtn.onclick = function () { setState({ step: 'summary' }); };
    }

    function bindText(inputId, stateKey) {
      var input = document.getElementById(inputId);
      if (!input) return;
      input.oninput = function (e) {
        state[stateKey] = e.target.value;
        var btn = document.getElementById('continueBtn');
        if (btn) btn.disabled = !(state.firstName.trim() && state.lastName.trim() && state.phone.trim());
      };
    }

    function toggleAddBtn() {
      var btn = document.getElementById('addItemBtn');
      if (btn) btn.disabled = state.submitting || !state.itemName.trim() || !state.itemPrice;
    }

    state._justEnteredItems = (state.step === 'items');
    render();
  </script>
</body>
</html>
